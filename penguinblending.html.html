<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>لعبة البطريق: دمج الحرف مع حرف المد</title>
  <style>
    :root {
      --sky-top: #bfe9ff;
      --sky-bottom: #eefbff;
      --ice: #f7fdff;
      --ice-edge: #d6f3ff;
      --navy: #17324d;
      --blue: #3c8edb;
      --yellow: #ffd95a;
      --pink: #ff8ca1;
      --green: #79d3a6;
      --shadow: 0 10px 28px rgba(23, 50, 77, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Geeza Pro", "Arial", "Tahoma", sans-serif;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      color: var(--navy);
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      padding: max(12px, env(safe-area-inset-top))
               max(12px, env(safe-area-inset-right))
               max(18px, env(safe-area-inset-bottom))
               max(12px, env(safe-area-inset-left));
    }

    .app {
      width: min(100%, 1050px);
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 4px 8px 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      line-height: 1.25;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      opacity: 0.85;
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 10px 0 14px;
    }

    .selector-card {
      background: rgba(255,255,255,0.88);
      border: 2px solid rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .selector-card h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      border: none;
      cursor: pointer;
    }

    .choice {
      min-width: 66px;
      min-height: 62px;
      border-radius: 18px;
      background: white;
      color: var(--navy);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(23,50,77,0.12);
      border: 3px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .choice:active {
      transform: scale(0.95);
    }

    .choice.selected {
      border-color: var(--blue);
      background: #edf7ff;
      transform: translateY(-2px);
    }

    .scene {
      position: relative;
      min-height: 440px;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 16% 17%, rgba(255,255,255,.85) 0 5px, transparent 6px),
        radial-gradient(circle at 82% 12%, rgba(255,255,255,.9) 0 6px, transparent 7px),
        radial-gradient(circle at 65% 31%, rgba(255,255,255,.75) 0 4px, transparent 5px),
        linear-gradient(#a9dcf6 0 57%, #eefbff 57% 100%);
      box-shadow: var(--shadow);
      border: 3px solid rgba(255,255,255,.85);
    }

    .mountain {
      position: absolute;
      bottom: 37%;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-bottom: 185px solid #d7eff9;
      opacity: 0.85;
    }

    .mountain::after {
      content: "";
      position: absolute;
      left: -65px;
      top: 78px;
      width: 0;
      height: 0;
      border-left: 65px solid transparent;
      border-right: 65px solid transparent;
      border-bottom: 92px solid #f9feff;
    }

    .m1 { left: -50px; transform: scale(.8); }
    .m2 { right: -30px; transform: scale(1.05); opacity: .65; }

    .track {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 87px;
      height: 132px;
      background: linear-gradient(180deg, #ffffff, #dff6ff);
      border-radius: 70px 70px 34px 34px;
      border: 4px solid rgba(255,255,255,.95);
      box-shadow: inset 0 -12px 0 var(--ice-edge), 0 10px 16px rgba(23,50,77,.12);
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 18px 7%;
      border-bottom: 4px dashed rgba(60,142,219,.25);
      border-radius: 50%;
    }

    .long-vowel-target {
      position: absolute;
      left: 7%;
      bottom: 117px;
      width: clamp(100px, 17vw, 150px);
      height: clamp(100px, 17vw, 150px);
      border-radius: 50%;
      background: white;
      border: 6px solid var(--yellow);
      display: grid;
      place-items: center;
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(23,50,77,.18);
      z-index: 4;
    }

    .target-label {
      position: absolute;
      left: 7%;
      bottom: 76px;
      width: clamp(100px, 17vw, 150px);
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .penguin-wrap {
      position: absolute;
      right: 8%;
      bottom: 105px;
      width: 128px;
      height: 176px;
      z-index: 5;
      transform-origin: 50% 100%;
    }

    .penguin-wrap.sliding {
      animation: slidePenguin 1.45s cubic-bezier(.2,.75,.25,1) forwards;
    }

    @keyframes slidePenguin {
      0%   { right: 8%; transform: rotate(0deg) translateY(0); }
      35%  { transform: rotate(-8deg) translateY(-6px); }
      72%  { transform: rotate(4deg) translateY(1px); }
      100% { right: calc(100% - clamp(205px, 27vw, 285px)); transform: rotate(0deg) translateY(0); }
    }

    .penguin {
      position: relative;
      width: 106px;
      height: 142px;
      margin: 20px auto 0;
      background: #182b3b;
      border-radius: 50% 50% 44% 44%;
      box-shadow: 0 7px 0 rgba(23,50,77,.15);
    }

    .belly {
      position: absolute;
      width: 72px;
      height: 91px;
      left: 17px;
      bottom: 10px;
      background: white;
      border-radius: 52% 52% 45% 45%;
    }

    .eye {
      position: absolute;
      top: 36px;
      width: 9px;
      height: 12px;
      background: white;
      border-radius: 50%;
      z-index: 2;
    }
    .eye::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 5px;
      background: #17202a;
      border-radius: 50%;
      top: 4px;
      left: 3px;
    }
    .eye.e1 { left: 31px; }
    .eye.e2 { right: 31px; }

    .beak {
      position: absolute;
      top: 53px;
      left: 43px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 18px solid #ffaf45;
      z-index: 3;
    }

    .wing {
      position: absolute;
      top: 63px;
      width: 29px;
      height: 72px;
      background: #182b3b;
      border-radius: 50%;
      z-index: -1;
    }
    .wing.w1 { right: -18px; transform: rotate(18deg); }
    .wing.w2 { left: -18px; transform: rotate(-18deg); }

    .foot {
      position: absolute;
      bottom: -8px;
      width: 34px;
      height: 14px;
      border-radius: 50%;
      background: #ffaf45;
    }
    .foot.f1 { left: 17px; transform: rotate(-8deg); }
    .foot.f2 { right: 17px; transform: rotate(8deg); }

    .grapheme-sign {
      position: absolute;
      top: -13px;
      right: -25px;
      width: 72px;
      height: 72px;
      background: var(--pink);
      color: white;
      border: 5px solid white;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 2.8rem;
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(23,50,77,.2);
      transform: rotate(5deg);
      z-index: 10;
    }

    .snow-splash {
      position: absolute;
      right: 12%;
      bottom: 98px;
      width: 90px;
      height: 20px;
      opacity: 0;
    }

    .snow-splash.show {
      animation: splash 1.2s ease-out;
    }

    @keyframes splash {
      0% { opacity: 0; transform: scale(.5); }
      40% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.7) translateX(-40px); }
    }

    .flake {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 7px rgba(60,142,219,.25);
    }

    .result-panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      width: min(82%, 430px);
      min-height: 72px;
      background: rgba(255,255,255,.95);
      border: 4px solid var(--green);
      border-radius: 22px;
      box-shadow: 0 8px 18px rgba(23,50,77,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 14px;
      z-index: 8;
    }

    .equation {
      display: flex;
      direction: rtl;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .result-word {
      color: #187a58;
      background: #e9fff5;
      border-radius: 14px;
      padding: 3px 14px 7px;
      min-width: 84px;
      text-align: center;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .action {
      min-height: 56px;
      padding: 10px 22px;
      border-radius: 18px;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(23,50,77,.15);
    }

    #blendBtn {
      background: var(--blue);
      color: white;
    }

    #resetBtn {
      background: white;
      color: var(--navy);
      border: 2px solid #cceaf7;
    }

    .hint {
      text-align: center;
      margin: 10px auto 0;
      font-size: .95rem;
      opacity: .75;
    }

    .joined-preview {
      position: absolute;
      left: calc(7% + clamp(50px, 8.5vw, 75px));
      bottom: 255px;
      transform: translateX(-50%);
      min-width: 105px;
      padding: 5px 16px 10px;
      border-radius: 18px;
      background: rgba(255,255,255,.93);
      border: 3px solid var(--pink);
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 700;
      text-align: center;
      opacity: 0;
      z-index: 7;
      box-shadow: 0 7px 14px rgba(23,50,77,.14);
    }

    .joined-preview.show {
      animation: popIn .45s ease forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateX(-50%) scale(.6); }
      to { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @media (max-width: 700px) {
      .control-panel {
        grid-template-columns: 1fr;
      }

      .scene {
        min-height: 410px;
      }

      .penguin-wrap {
        transform: scale(.88);
        transform-origin: 50% 100%;
      }

      .penguin-wrap.sliding {
        animation-name: slidePenguinMobile;
      }

      @keyframes slidePenguinMobile {
        0%   { right: 5%; transform: scale(.88) rotate(0deg); }
        35%  { transform: scale(.88) rotate(-8deg) translateY(-6px); }
        72%  { transform: scale(.88) rotate(4deg); }
        100% { right: calc(100% - 210px); transform: scale(.88) rotate(0deg); }
      }

      .long-vowel-target {
        left: 5%;
      }

      .target-label {
        left: 5%;
      }

      .joined-preview {
        left: 17%;
      }
    }

    @media (max-width: 430px) {
      .choice {
        min-width: 58px;
        min-height: 56px;
      }

      .scene {
        min-height: 390px;
      }

      .result-panel {
        width: 92%;
      }

      .equation {
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .penguin-wrap.sliding {
        animation-duration: .01ms;
      }
      .snow-splash.show,
      .joined-preview.show {
        animation-duration: .01ms;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🐧 انزلاق البطريق ودمج حرف المد</h1>
      <p class="subtitle">اختاري الحرف، ثم اختاري حرف المد، واضغطي «ادمج».</p>
    </header>

    <section class="control-panel" aria-label="اختيار الحرف وحرف المد">
      <div class="selector-card">
        <h2>١. اختاري الحرف</h2>
        <div class="button-row" id="consonantButtons">
          <button class="choice selected" data-consonant="ف" aria-label="الحرف ف">ف</button>
          <button class="choice" data-consonant="د" aria-label="الحرف د">د</button>
          <button class="choice" data-consonant="ر" aria-label="الحرف ر">ر</button>
        </div>
      </div>

      <div class="selector-card">
        <h2>٢. اختاري حرف المد</h2>
        <div class="button-row" id="vowelButtons">
          <button class="choice selected" data-vowel="و" aria-label="حرف المد واو">و</button>
          <button class="choice" data-vowel="ا" aria-label="حرف المد ألف">ا</button>
          <button class="choice" data-vowel="ي" aria-label="حرف المد ياء">ي</button>
        </div>
      </div>
    </section>

    <section class="scene" aria-label="منطقة اللعب">
      <div class="mountain m1"></div>
      <div class="mountain m2"></div>

      <div class="track"></div>

      <div class="long-vowel-target" id="vowelTarget">و</div>
      <div class="target-label">حرف المد</div>

      <div class="penguin-wrap" id="penguinWrap">
        <div class="penguin">
          <div class="belly"></div>
          <div class="eye e1"></div>
          <div class="eye e2"></div>
          <div class="beak"></div>
          <div class="wing w1"></div>
          <div class="wing w2"></div>
          <div class="foot f1"></div>
          <div class="foot f2"></div>
        </div>
        <div class="grapheme-sign" id="graphemeSign">ف</div>
      </div>

      <div class="snow-splash" id="snowSplash" aria-hidden="true">
        <span class="flake" style="left:0;top:6px"></span>
        <span class="flake" style="left:18px;top:0"></span>
        <span class="flake" style="left:37px;top:8px"></span>
        <span class="flake" style="left:57px;top:2px"></span>
        <span class="flake" style="left:76px;top:10px"></span>
      </div>

      <div class="joined-preview" id="joinedPreview">فـ + و</div>

      <div class="result-panel" aria-live="polite">
        <div class="equation">
          <span id="equationConsonant">فـ</span>
          <span>+</span>
          <span id="equationVowel">و</span>
          <span>=</span>
          <span class="result-word" id="resultWord">فو</span>
        </div>
      </div>
    </section>

    <div class="action-row">
      <button class="action" id="blendBtn">⛸️ ادمج</button>
      <button class="action" id="resetBtn">↻ إعادة</button>
    </div>

    <p class="hint">يظهر الحرف في وضعه الأوّلي عند اقترابه من حرف المد، ثم تظهر نتيجة الدمج أسفل اللعبة.</p>
  </main>

  <script>
    (() => {
      "use strict";

      let consonant = "ف";
      let vowel = "و";
      let isAnimating = false;

      const consonantButtons = [...document.querySelectorAll("[data-consonant]")];
      const vowelButtons = [...document.querySelectorAll("[data-vowel]")];
      const penguinWrap = document.getElementById("penguinWrap");
      const graphemeSign = document.getElementById("graphemeSign");
      const vowelTarget = document.getElementById("vowelTarget");
      const equationConsonant = document.getElementById("equationConsonant");
      const equationVowel = document.getElementById("equationVowel");
      const resultWord = document.getElementById("resultWord");
      const joinedPreview = document.getElementById("joinedPreview");
      const snowSplash = document.getElementById("snowSplash");
      const blendBtn = document.getElementById("blendBtn");
      const resetBtn = document.getElementById("resetBtn");

      function initialForm(letter) {
        // These letters are shown with a connection mark so the child sees the
        // initial/connected visual form just before blending.
        return letter + "ـ";
      }

      function updateDisplay() {
        graphemeSign.textContent = consonant;
        vowelTarget.textContent = vowel;
        equationConsonant.textContent = initialForm(consonant);
        equationVowel.textContent = vowel;
        resultWord.textContent = consonant + vowel;
        joinedPreview.textContent = initialForm(consonant) + " + " + vowel;
      }

      function selectButton(buttons, activeButton) {
        buttons.forEach(btn => btn.classList.toggle("selected", btn === activeButton));
      }

      consonantButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          if (isAnimating) return;
          consonant = btn.dataset.consonant;
          selectButton(consonantButtons, btn);
          resetScene(false);
          updateDisplay();
        });
      });

      vowelButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          if (isAnimating) return;
          vowel = btn.dataset.vowel;
          selectButton(vowelButtons, btn);
          resetScene(false);
          updateDisplay();
        });
      });

      function runBlend() {
        if (isAnimating) return;
        isAnimating = true;
        resetScene(false);

        // Force Safari to register the reset before replaying the animation.
        void penguinWrap.offsetWidth;

        snowSplash.classList.add("show");
        penguinWrap.classList.add("sliding");

        setTimeout(() => {
          graphemeSign.textContent = initialForm(consonant);
          joinedPreview.classList.add("show");
        }, 980);

        setTimeout(() => {
          resultWord.textContent = consonant + vowel;
          isAnimating = false;
        }, 1450);
      }

      function resetScene(restoreSign = true) {
        penguinWrap.classList.remove("sliding");
        snowSplash.classList.remove("show");
        joinedPreview.classList.remove("show");
        if (restoreSign) graphemeSign.textContent = consonant;
        isAnimating = false;
      }

      blendBtn.addEventListener("click", runBlend);
      resetBtn.addEventListener("click", () => {
        resetScene(true);
        updateDisplay();
      });

      // Extra iPad/Safari safety: prevent accidental double-tap zoom on controls.
      let lastTouchEnd = 0;
      document.addEventListener("touchend", event => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      updateDisplay();
    })();
  </script>
</body>
</html>
